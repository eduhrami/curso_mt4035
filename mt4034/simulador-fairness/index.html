<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador de Fairness</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#1c2230; --muted:#5d6676; --line:#e1e5eb; --soft:#f0f2f6;
  --accent:#2f5bea; --accent-ink:#ffffff;
  --tp:#009E73; --fn:#CC79A7; --fp:#E69F00; --tn:#8e99aa;
  --bad:#c0392b; --bad-bg:#fdecea; --good:#1a7f52; --good-bg:#e6f5ee; --neutral:#5d6676; --neutral-bg:#eef0f4;
  --warn:#9a6a00; --warn-bg:#fff4d6;
  --ga:#0072B2; --gb:#8a4fb0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151b; --panel:#1b1f28; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2d333f; --soft:#232834;
    --accent:#7c9bff; --accent-ink:#0f1320;
    --tn:#6c7789; --bad:#ff7b6e; --bad-bg:#3a1f1d; --good:#52d293; --good-bg:#16332a; --neutral:#a7afbd; --neutral-bg:#262b36;
    --warn:#f2c14e; --warn-bg:#3a3018; --ga:#56B4E9; --gb:#c79bea;
  }
}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1b1f28; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2d333f; --soft:#232834;
  --accent:#7c9bff; --accent-ink:#0f1320;
  --tn:#6c7789; --bad:#ff7b6e; --bad-bg:#3a1f1d; --good:#52d293; --good-bg:#16332a; --neutral:#a7afbd; --neutral-bg:#262b36;
  --warn:#f2c14e; --warn-bg:#3a3018; --ga:#56B4E9; --gb:#c79bea;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
.hdr{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
.hdr h1{font-size:18px;margin:0}
.hdr .sub{color:var(--muted);font-size:13px}
.hdr .sp{flex:1}
button,select,textarea,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
main{padding:16px 0 48px}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h2 .n{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
h3{font-size:14px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.disclaimer{font-size:12px;color:var(--muted);padding:8px 0 0}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.case-btn{text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px;cursor:pointer}
.case-btn.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--panel)}
.case-btn b{display:block;font-size:14px}
.case-btn span{font-size:12px;color:var(--muted)}
.brief{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-top:14px}
.brief p{margin:0 0 8px}
.objective{border-left:4px solid var(--accent);background:var(--soft);padding:10px 12px;border-radius:0 8px 8px 0}
.objective q{font-style:italic}
.note{font-size:12.5px;background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:8px 10px;margin-top:8px}
.grp{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dA{background:var(--ga)} .dB{background:var(--gb)}
.cfg{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}
.strats{display:flex;flex-direction:column;gap:6px}
.strats label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.strats label.on{border-color:var(--accent);background:var(--soft)}
.strats small{display:block;color:var(--muted);font-size:12px}
.slider{margin:10px 0 14px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.slider .val{font-variant-numeric:tabular-nums;font-weight:700}
.slider.disabled input{opacity:.45}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px;background:var(--neutral-bg);color:var(--neutral);font-weight:600;white-space:nowrap}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.good{background:var(--good-bg);color:var(--good)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.warnbox{background:var(--warn-bg);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
.groups2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gpanel{border:1px solid var(--line);border-radius:10px;padding:12px}
.gpanel h3{display:flex;align-items:center;gap:8px;justify-content:space-between}
table.cm{border-collapse:separate;border-spacing:4px;width:100%;font-size:13px}
table.cm th{font-weight:600;color:var(--muted);font-size:12px;text-align:center;padding:2px}
table.cm th.rh{text-align:right}
table.cm td{border-radius:8px;padding:8px;text-align:center;border:2px solid transparent;transition:transform .1s}
table.cm td .k{font-weight:700;font-size:12px}
table.cm td .c{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
table.cm td .m{font-size:11px;opacity:.9}
td.tp{background:color-mix(in srgb,var(--tp) 22%,transparent)} td.fn{background:color-mix(in srgb,var(--fn) 25%,transparent)}
td.fp{background:color-mix(in srgb,var(--fp) 25%,transparent)} td.tn{background:color-mix(in srgb,var(--tn) 22%,transparent)}
td.hl{border-color:var(--ink)!important;transform:scale(1.03)}
.hist svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.waffle{display:grid;grid-template-columns:repeat(40,1fr);gap:2px;margin-top:8px}
.waffle i{aspect-ratio:1;border-radius:2px;display:block}
.formulas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:14px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:default}
.fcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.fcard .fair{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.fcard .q{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.eq{display:flex;align-items:center;gap:8px;font-family:"Cambria Math","Times New Roman",serif;font-size:17px;margin:6px 0}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.frac span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}
.frac span:last-child{padding:0 4px}
.words{font-family:"Cambria Math","Times New Roman",serif;font-size:14px;color:var(--muted)}
.subst{font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px}
.subst div{display:flex;justify-content:space-between;gap:8px}
.gapline{margin-top:6px;display:flex;justify-content:space-between;align-items:center;font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.bar{height:6px;background:var(--soft);border-radius:3px;position:relative;margin-top:4px}
.bar b{position:absolute;top:0;bottom:0;border-radius:3px}
.imp{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.voices{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start}
.av{flex:0 0 38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.bubble{flex:1;border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;background:var(--soft)}
.bubble.bad{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.bubble.good{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.who b{font-size:13.5px}
.who .role{color:var(--muted)}
.bubble p{margin:4px 0 0}
.lens{font-size:11px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.press{display:flex;flex-direction:column;gap:10px}
.news{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.news .outlet{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.news h4{font-family:Georgia,"Times New Roman",serif;font-size:17px;margin:4px 0;line-height:1.25}
.news p{margin:0;font-size:13px;color:var(--muted)}
.news.bad{border-left:4px solid var(--bad)} .news.good{border-left:4px solid var(--good)}
.score{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.verdict{border-radius:10px;padding:12px 14px;margin-top:10px}
.verdict.ok{background:var(--good-bg)} .verdict.ko{background:var(--bad-bg)}
.verdict h3{font-size:16px}
.verdict ul{margin:6px 0 0;padding-left:18px}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel)}
.log{font-size:13px;margin-top:10px}
.log li{margin-bottom:4px}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);margin-bottom:12px}
details summary{cursor:pointer;font-weight:600}
table.tr{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}
table.tr th,table.tr td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
table.tr th{color:var(--muted);font-size:12px}
.refs li{font-size:13px;margin-bottom:4px}
.stepper{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stepper button{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.stepper button .n{background:var(--soft);color:var(--muted);border-radius:50%;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
.stepper button.on{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 2px var(--accent) inset}
.stepper button.on .n,.stepper button.done .n{background:var(--accent);color:var(--accent-ink)}
.stepper button:disabled{opacity:.5;cursor:not-allowed}
.navrow{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.recap{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13.5px}
.recap p{margin:2px 0}
.choice{font-size:13.5px;margin:6px 0;padding:6px 10px;border-radius:8px;background:var(--panel)}
.brief>*,.cfg>*,.groups2>*,.two>*,.gpanel{min-width:0}
@media (max-width:860px){
  .brief,.cfg,.groups2,.two{grid-template-columns:1fr}
  table.cm td .c{font-size:18px}
}
@media print{header{position:static} .btn{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap hdr">
    <div>
      <h1 id="t-title"></h1>
      <div class="sub" id="t-subtitle"></div>
    </div>
    <div class="sp"></div>
    <button class="btn" id="btn-lang" type="button"></button>
  </div>
</header>

<main class="wrap">
  <nav class="stepper" id="stepper" aria-label="steps">
    <button type="button" data-scr="1"><span class="n">1</span><span id="t-nav1"></span></button>
    <button type="button" data-scr="2"><span class="n">2</span><span id="t-nav2"></span></button>
    <button type="button" data-scr="3"><span class="n">3</span><span id="t-nav3"></span></button>
  </nav>

  <!-- Pantalla 1: caso y explicación -->
  <div class="screen" id="scr-1">
    <details id="guide">
      <summary id="t-guide"></summary>
      <div id="guide-body"></div>
    </details>
    <section class="card">
      <h2 id="t-step1"></h2>
      <div class="cases" id="cases"></div>
      <div class="brief" id="brief"></div>
    </section>
    <div class="navrow"><span></span><button class="btn primary" type="button" id="btn-next1"></button></div>
  </div>

  <!-- Pantalla 2: decisiones del alumno -->
  <div class="screen" id="scr-2" hidden>
    <div class="recap" id="recap2"></div>
    <section class="card">
      <h2 id="t-step2"></h2>
      <div class="cfg">
        <div>
          <h3 id="t-strategy"></h3>
          <div class="strats" id="strats"></div>
        </div>
        <div>
          <h3 id="t-thresholds"></h3>
          <p class="small muted" id="t-thrhelp"></p>
          <div class="slider" id="sl-B">
            <div class="row"><label for="in-B" id="lb-B"></label><span class="val" id="v-B"></span></div>
            <input type="range" id="in-B" min="0" max="100" step="0.5">
          </div>
          <div class="slider" id="sl-A">
            <div class="row"><label for="in-A" id="lb-A"></label><span class="val" id="v-A"></span></div>
            <input type="range" id="in-A" min="0" max="100" step="0.5">
          </div>
          <div id="cfg-warn"></div>
          <div class="imp" id="imp"></div>
        </div>
      </div>
    </section>
    <section class="card">
      <h2 id="t-step3"></h2>
      <div class="groups2" id="groups"></div>
      <div class="legend" id="legend"></div>
      <div class="formulas" id="formulas"></div>
    </section>
    <section class="card">
      <h2 id="t-stepJ"></h2>
      <p class="small muted" id="t-evalhelp"></p>
      <label for="justif" class="small" id="t-justif"></label>
      <textarea id="justif"></textarea>
      <div id="justif-warn"></div>
    </section>
    <div class="navrow">
      <button class="btn" type="button" id="btn-back2"></button>
      <button class="btn primary" type="button" id="btn-deploy"></button>
    </div>
  </div>

  <!-- Pantalla 3: resultados y conclusión -->
  <div class="screen" id="scr-3" hidden>
    <div class="recap" id="recap3"></div>
    <div class="two">
      <section class="card">
        <h2 id="t-step4"></h2>
        <div class="score" id="vscore"></div>
        <div class="voices" id="voices"></div>
      </section>
      <section class="card">
        <h2 id="t-step5"></h2>
        <div class="press" id="press"></div>
      </section>
    </div>
    <section class="card">
      <h2 id="t-step6"></h2>
      <div id="verdict"></div>
      <h3 style="margin-top:14px" id="t-logTitle"></h3>
      <ol class="log" id="log"></ol>
      <button class="btn" id="btn-dl" type="button"></button>
    </section>
    <div class="navrow">
      <button class="btn" type="button" id="btn-back3"></button>
      <button class="btn primary" type="button" id="btn-other"></button>
    </div>
  </div>

  <p class="disclaimer" id="t-disclaimer"></p>
</main>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Configuración general
// ---------------------------------------------------------------------------
const TOL = 0.03;          // brecha máxima (3 pp) para considerar una métrica "cumplida"
const N_PER_GROUP = 1000;  // personas simuladas por grupo
const MK = { dp: "sr", eo: "tpr", pp: "ppv" }; // estrategia -> tasa que se iguala

// ---------------------------------------------------------------------------
// Textos de interfaz
// ---------------------------------------------------------------------------
const UI = {
  es: {
    title: "Simulador de Fairness",
    subtitle: "MT4034 · Aplicaciones, gestión y gobernanza de la IA — métricas de equidad algorítmica",
    lang: "English",
    guide: "Guía de la práctica, traductor de métricas y referencias",
    nav1: "Caso", nav2: "Decisión", nav3: "Resultados",
    step1: "Elige el caso y lee su objetivo social",
    step2: "¿Qué métrica de equidad optimizas?",
    step3: "Matriz de confusión y tasas por grupo",
    stepJ: "Justifica tu decisión",
    step4: "Voces de quienes perciben injusticia (simuladas)",
    step5: "Cobertura de prensa (ficticia)",
    step6: "Conclusión y retroalimentación",
    next1: "Continuar: tomar la decisión →",
    back2: "← Volver al caso",
    deploy: "Desplegar el modelo y ver resultados →",
    back3: "← Ajustar mi decisión",
    other: "Elegir otro caso",
    recapCase: "Caso: {c}",
    recapDecision: "Tu decisión: {s} · umbrales {A} = {tA}, {B} = {tB}",
    justifNeeded: "Escribe tu justificación antes de desplegar el modelo.",
    yourJustif: "Tu justificación:",
    choiceRight: "Elección de métrica: correcta. Optimizaste {m}, que es la que materializa el objetivo del caso.",
    choiceWrong: "Elección de métrica: incorrecta. Optimizaste {s}; el objetivo del caso pedía {m}.",
    choiceNone: "Elección de métrica: no declaraste una métrica ({s}). El caso pedía {m}.",
    choiceManualOk: "Elección de métrica: con umbrales manuales lograste cumplir {m}, la que pide el caso.",
    logH: "Bitácora de intentos",
    context: "Contexto", decision: "Decisión del modelo", positive: "Positivo real", objective: "Objetivo social del caso",
    groups: "Grupos", baseRate: "tasa base",
    strategy: "Métrica a optimizar",
    strat: {
      single: ["Sin restricción (umbral único)", "El mismo umbral para ambos grupos. Ninguna métrica de equidad se fuerza."],
      dp: ["Paridad demográfica", "Ajusta el umbral de {A} para igualar la tasa de selección (VP + FP) / N."],
      eo: ["Igualdad de oportunidad", "Ajusta el umbral de {A} para igualar la TPR: VP / (VP + FN)."],
      pp: ["Paridad predictiva", "Ajusta el umbral de {A} para igualar la precisión (PPV): VP / (VP + FP)."],
      manual: ["Manual (umbrales libres)", "Mueve ambos umbrales y observa qué métrica se cumple."]
    },
    thresholds: "Umbrales de decisión",
    thrhelp: "El modelo asigna un puntaje de 0 a 100 (probabilidad estimada de merecer el resultado favorable). Resultado favorable si puntaje ≥ umbral.",
    thrB: "Umbral para {B} (grupo de referencia)",
    thrA: "Umbral para {A}",
    auto: "calculado para cumplir la métrica",
    degenerate: "Solución trivial: casi todos (o casi nadie) reciben el resultado favorable. Las métricas se igualan, pero el modelo deja de discriminar entre casos.",
    imp: "Teorema de imposibilidad: con tasas base distintas ({brA} vs {brB}), un modelo con errores no puede cumplir las tres a la vez.",
    real: "Real", pred: "Predicción",
    cells: { tp: "VP", fp: "FP", fn: "FN", tn: "VN" },
    cellsLong: { tp: "Verdadero positivo", fp: "Falso positivo", fn: "Falso negativo", tn: "Verdadero negativo" },
    histUp: "↑ {pos}", histDown: "↓ {neg}", histThr: "umbral",
    waffle: "Cada cuadro ≈ 5 personas",
    fRef: "Referencia de errores (no se optimiza)",
    gap: "Brecha", met: "se cumple", notMet: "no se cumple",
    tone: { bad: "Percibe injusticia", good: "Percibe justicia", priv: "Sin agravio" },
    vscore: "{b} de {n} participantes perciben injusticia",
    vnone: "Ningún participante expresa agravio con esta configuración.",
    lens: "Lente: {m}",
    pressNone: "Sin cobertura relevante.",
    fictional: "medio ficticio",
    evalhelp: "Antes de desplegar, explica por qué elegiste esa métrica en términos del objetivo social del caso. En la pantalla de resultados verás cómo reaccionan los participantes y la prensa, y recibirás retroalimentación sobre tu elección.",
    justif: "Justificación (¿qué error es más grave en este caso y para quién?)",
    dl: "Descargar bitácora (.txt)",
    aligned: "Alineado con el objetivo social",
    misaligned: "Desalineado con el objetivo social",
    lucky: "Alineado por coincidencia",
    luckyTxt: "Con este umbral la brecha en la métrica objetivo quedó pequeña, pero tu estrategia optimiza otra métrica. Mueve el umbral de referencia: la alineación no se sostiene porque no es lo que el modelo está garantizando.",
    targetIs: "Métrica que materializa el objetivo del caso: {m}.",
    gapIs: "Brecha resultante en esa métrica: {g} puntos ({a} vs {b}).",
    costs: "Costos que acepta esta configuración (métricas que se rompen):",
    noCosts: "No se rompe ninguna otra métrica relevante.",
    complaints: "Participantes que perciben injusticia:",
    degenerateV: "La configuración es trivial (casi todos o casi nadie recibe el resultado favorable); la igualdad de métricas no tiene valor práctico.",
    logEntry: "{t} · {case} · {strat} · umbrales {A}={tA}, {B}={tB} · {v}",
    disclaimer: "Datos simulados (1,000 personas por grupo, puntajes calibrados con semilla fija). Personajes, diálogos y medios son ficticios y tienen fines didácticos; los casos se inspiran en hechos documentados citados en la guía.",
    logTitle: "Bitácora del simulador de fairness — MT4034",

// ---------------------------------------------------------------------------
// Modelo: población simulada con puntajes calibrados (semilla fija)
// ---------------------------------------------------------------------------
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function gauss(rng) { let u = 0; while (u === 0) u = rng(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rng()); }
const sig = (x) => 1 / (1 + Math.exp(-x));

// Riesgo latente r ~ sigmoid(mu + sd·z); y ~ Bernoulli(r); puntaje = sigmoid(mu + sd·z + sesgo).
// Sin sesgo el puntaje está calibrado; un sesgo negativo subestima al grupo (proxy deficiente).
function makeGroup(base, sd, bias, seed) {
  const n = N_PER_GROUP, rng = mulberry32(seed), z = [];
  for (let i = 0; i < n; i++) z.push(gauss(rng));
  let lo = -8, hi = 8;
  for (let k = 0; k < 60; k++) {
    const m = (lo + hi) / 2; let s = 0;
    for (const v of z) s += sig(m + sd * v);
    if (s / n < base) lo = m; else hi = m;
  }
  const mu = (lo + hi) / 2;
  const people = z.map((v) => ({ s: 100 * sig(mu + sd * v + bias), y: rng() < sig(mu + sd * v) ? 1 : 0 }))
                  .sort((a, b) => b.s - a.s);
  const pre = new Int32Array(n + 1);
  people.forEach((p, i) => { pre[i + 1] = pre[i] + p.y; });
  return { n, people, s: Float64Array.from(people.map((p) => p.s)), pre, pos: pre[n] };
}

function countsAt(G, t) {
  let lo = 0, hi = G.n;
  while (lo < hi) { const m = (lo + hi) >> 1; if (G.s[m] >= t) lo = m + 1; else hi = m; }
  const tp = G.pre[lo], fp = lo - tp;
  return { tp, fp, fn: G.pos - tp, tn: G.n - G.pos - fp, n: G.n };
}
const div = (a, b) => (b > 0 ? a / b : NaN);
function rates(c) {
  return { sr: div(c.tp + c.fp, c.n), tpr: div(c.tp, c.tp + c.fn), ppv: div(c.tp, c.tp + c.fp), fpr: div(c.fp, c.fp + c.tn) };
}
// Busca el umbral de A que iguala la métrica con B (desempate: el más cercano a tB)
function solveA(GA, GB, tB, metric) {
  const target = rates(countsAt(GB, tB))[metric];
  if (isNaN(target)) return tB;
  let best = null;
  for (let i = 0; i <= 1000; i++) {
    const t = i / 10, v = rates(countsAt(GA, t))[metric];
    if (isNaN(v)) continue;
    const e = Math.abs(v - target) + 1e-6 * Math.abs(t - tB);
    if (!best || e < best.e) best = { t, e };
  }
  return best ? best.t : tB;
}

const pct = (x) => (isNaN(x) ? "—" : (x * 100).toFixed(1) + "%");

function compute() {
  const c = cur(), D = data(c);
  let tA = state.tA;
  if (state.strategy === "single") tA = state.tB;
  else if (MK[state.strategy]) tA = solveA(D.A, D.B, state.tB, MK[state.strategy]);
  state.tA = tA;
  const C = { A: countsAt(D.A, tA), B: countsAt(D.B, state.tB) };
  const R = { A: rates(C.A), B: rates(C.B) };
  const fpAll = C.A.fp + C.B.fp, negAll = C.A.fp + C.A.tn + C.B.fp + C.B.tn;
  const sel = C.A.tp + C.A.fp + C.B.tp + C.B.fp;
  const lowSr = Math.min(R.A.sr, R.B.sr), highSr = Math.max(R.A.sr, R.B.sr);
  R.T = { fpAll, fprAll: div(fpAll, negAll), sel, selRate: sel / (C.A.n + C.B.n),
          defRate: div(fpAll, sel), ir: highSr > 0 ? lowSr / highSr : NaN };
  R.base = { A: D.A.pos / D.A.n, B: D.B.pos / D.B.n };
  return { c, D, C, R, tA };
}

// Variables para plantillas: valores globales + variables de la lente
function baseVars(S) {
  const { c, C, R } = S, v = {};
  for (const m of ["sr", "tpr", "ppv", "fpr"]) { v[m + "A"] = pct(R.A[m]); v[m + "B"] = pct(R.B[m]); }
  for (const g of ["A", "B"]) for (const k of ["tp", "fp", "fn", "tn"]) v[k + g] = C[g][k];
  v.A = gname(c, "A"); v.B = gname(c, "B");
  v.fpAll = R.T.fpAll; v.fprAll = pct(R.T.fprAll); v.sel = R.T.sel; v.cap = c.cap || "";
  v.defRate = pct(R.T.defRate); v.ir = isNaN(R.T.ir) ? "—" : R.T.ir.toFixed(2);
  return v;
}
function lensVars(S, m, v) {
  const { c, R } = S;
  if (!METRICS[m]) return v;
  const a = R.A[m], b = R.B[m], loG = a <= b ? "A" : "B", hiG = loG === "A" ? "B" : "A";
  return Object.assign({}, v, {
    lo_pl: c.groups[loG][state.lang].pl, hi_pl: c.groups[hiG][state.lang].pl,
    loName: gname(c, loG), hiName: gname(c, hiG),
    xlo: pct(R[loG][m]), xhi: pct(R[hiG][m]), gap: isNaN(a - b) ? "—" : (Math.abs(a - b) * 100).toFixed(1)
  });
}
// Estado de una lente institucional: brecha absoluta o lente personalizada
function lensStatus(S, lens) {
  const { c, R } = S;
  if (c.custom && c.custom[lens]) return c.custom[lens](R, c);
  const g = Math.abs(R.A[lens] - R.B[lens]);
  if (isNaN(g)) return { bad: false, sev: 0 };
  return { bad: g > TOL, sev: g };
}
function lensLabel(lens) {
  if (METRICS[lens]) { const m = METRICS[lens][state.lang]; return m.fair === "Referencia" || m.fair === "Reference" ? m.name : m.fair + " · " + m.name; }
  const names = { es: { safety: "seguridad pública (reincidentes liberados)", capacity: "capacidad presupuestal", default: "morosidad de la cartera", impact: "razón de impacto (regla 4/5)" },
                  en: { safety: "public safety (released reoffenders)", capacity: "budget capacity", default: "portfolio default rate", impact: "impact ratio (4/5 rule)" } };
  return names[state.lang][lens] || lens;
}

const BINS = 50;
const binCache = new WeakMap();
function histBins(G) {
  if (binCache.has(G)) return binCache.get(G);
  const up = new Array(BINS).fill(0), dn = new Array(BINS).fill(0);
  for (const p of G.people) { const b = Math.min(BINS - 1, Math.floor(p.s / (100 / BINS))); if (p.y) up[b]++; else dn[b]++; }
  const r = { up, dn, max: Math.max(...up, ...dn) };
  binCache.set(G, r);
  return r;
}
function histSVG(G, th, maxBin, lb) {
  const W = 500, H = 150, mid = 75, bw = W / BINS, h = histBins(G), sc = (mid - 12) / maxBin, t = L();
  let bars = "";
  for (let i = 0; i < BINS; i++) {
    const on = (i + 0.5) * (100 / BINS) >= th, x = i * bw + 0.5;
    if (h.up[i]) bars += `<rect x="${x}" y="${mid - h.up[i] * sc}" width="${bw - 1}" height="${h.up[i] * sc}" fill="var(--${on ? "tp" : "fn"})"/>`;
    if (h.dn[i]) bars += `<rect x="${x}" y="${mid}" width="${bw - 1}" height="${h.dn[i] * sc}" fill="var(--${on ? "fp" : "tn"})"/>`;
  }
  const tx = th / 100 * W;
  return `<svg viewBox="0 0 ${W} ${H + 14}" role="img">
    ${bars}
    <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)"/>
    <line x1="${tx}" x2="${tx}" y1="0" y2="${H}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="${Math.min(tx + 4, W - 60)}" y="10" font-size="11" fill="var(--ink)">${esc(t.histThr)} ${th.toFixed(1)}</text>
    <text x="2" y="10" font-size="11" fill="var(--muted)">${esc(fill(t.histUp, { pos: lb.posReal }))}</text>
    <text x="2" y="${H - 2}" font-size="11" fill="var(--muted)">${esc(fill(t.histDown, { neg: lb.negReal }))}</text>
    <text x="0" y="${H + 12}" font-size="10" fill="var(--muted)">0</text>
    <text x="${W / 2 - 6}" y="${H + 12}" font-size="10" fill="var(--muted)">50</text>
    <text x="${W - 18}" y="${H + 12}" font-size="10" fill="var(--muted)">100</text>
  </svg>`;
}
// 200 cuadros por grupo (≈5 personas cada uno), reparto por mayor residuo
function waffle(k) {
  const keys = ["tp", "fn", "fp", "tn"], total = 200;
  const raw = keys.map((x) => k[x] / k.n * total), cnt = raw.map(Math.floor);
  let left = total - cnt.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { cnt[i]++; left--; } });
  return keys.map((x, i) => `<i style="background:var(--${x})"></i>`.repeat(cnt[i])).join("");
}

function renderFormulas(S) {
  const t = L(), cells = t.cells, sel = MK[state.strategy];
  const sym = (arr) => arr.map((k) => (k === "n" ? "N" : cells[k])).join(" + ");
  const num = (arr, k) => arr.map((x) => (x === "n" ? k.n : k[x]));
  $("formulas").innerHTML = ["sr", "tpr", "ppv", "fpr"].map((m) => {
    const M = METRICS[m], d = M[state.lang], st = lensStatus(S, m);
    const line = (g) => {
      const k = S.C[g], n = num(M.num, k), dn = num(M.den, k);
      const nv = n.reduce((a, b) => a + b, 0), dv = dn.reduce((a, b) => a + b, 0);
      const den = dn.length > 1 ? `(${dn.join(" + ")})` : dn[0];
      const nn = n.length > 1 ? `(${n.join(" + ")})` : n[0];
      return `<div><span class="grp"><i class="dot d${g}"></i>${g}</span><span>${nn} / ${den} = ${nv}/${dv} = <b>${pct(div(nv, dv))}</b></span></div>`;
    };
    const a = S.R.A[m], b = S.R.B[m];
    const bar = (val, g) => isNaN(val) ? "" : `<b style="left:0;width:${val * 100}%;background:var(--g${g.toLowerCase()});opacity:.75;height:3px;top:${g === "A" ? 0 : 3}px"></b>`;
    return `<div class="fcard${sel === m ? " sel" : ""}" data-m="${m}">
      <div class="fair">${esc(m === "fpr" ? t.fRef : d.fair)}</div>
      <b>${esc(d.name)}</b>
      <div class="q">${esc(d.q)}</div>
      <div class="words">${esc(d.words)}</div>
      <div class="eq"><span>${m.toUpperCase() === "SR" ? (state.lang === "es" ? "Tasa" : "Rate") : m.toUpperCase()} =</span><span class="frac"><span>${sym(M.num)}</span><span>${sym(M.den)}</span></span></div>
      <div class="subst">${line("A")}${line("B")}</div>
      <div class="bar">${bar(a, "A")}${bar(b, "B")}</div>
      ${m === "fpr" ? `<div class="gapline"><span>${esc(t.gap)}: ${isNaN(a - b) ? "—" : (Math.abs(a - b) * 100).toFixed(1) + " pp"}</span></div>`
        : `<div class="gapline"><span>${esc(t.gap)}: ${isNaN(a - b) ? "—" : (Math.abs(a - b) * 100).toFixed(1) + " pp"}</span><span class="tag ${st.bad ? "bad" : "good"}">${st.bad ? "✗ " + esc(t.notMet) : "✓ " + esc(t.met)}</span></div>`}
    </div>`;
  }).join("");
}

function personaState(S, p) {
  if (!p.group) return lensStatus(S, p.lens).bad ? "bad" : "good";
  const o = p.group === "A" ? "B" : "A", diff = S.R[p.group][p.lens] - S.R[o][p.lens];
  if (isNaN(diff)) return "good";
  return diff < -TOL ? "bad" : diff > TOL ? "priv" : "good";
}
const AV_COLORS = ["#0072B2", "#8a4fb0", "#b5523b", "#2f7d5b", "#7a6a1f"];
function voiceList(S) {
  const c = S.c, v = baseVars(S);
  return c.personas.map((p, i) => {
    const st = personaState(S, p), tx = p[state.lang];
    let msg = fill(tx[st] || tx.good, lensVars(S, p.lens, v));
    if (p.extra && p.group) {
      const o = p.group === "A" ? "B" : "A";
      if (S.R[o][p.extra.lens] - S.R[p.group][p.extra.lens] > TOL && st === "bad") msg += fill(tx.extra, v);
    }
    return { p, i, st, msg, name: tx.name || p.name, role: tx.role };
  });
}
function renderVoices(S) {
  const t = L(), c = S.c, all = voiceList(S), list = all.filter((x) => x.st === "bad");
  $("vscore").innerHTML = `<span class="tag ${list.length ? "bad" : "good"}">${esc(fill(t.vscore, { b: list.length, n: all.length }))}</span>`;
  $("voices").innerHTML = list.length === 0 ? `<p class="muted small">${esc(t.vnone)}</p>` : list.map(({ p, i, st, msg, name, role }) => `
    <div class="msg">
      <div class="av" style="background:${p.group === "A" ? "var(--ga)" : p.group === "B" ? "var(--gb)" : AV_COLORS[(i + 2) % AV_COLORS.length]}">${esc(p.init)}</div>
      <div class="bubble ${st}">
        <div class="who"><b>${esc(name)}</b><span class="role">${esc(role)}</span>${p.group ? `<span class="tag">${p.group} · ${esc(gname(c, p.group))}</span>` : ""}<span class="tag ${st === "bad" ? "bad" : st === "good" ? "good" : ""}">${esc(t.tone[st])}</span></div>
        <p>«${esc(msg)}»</p>
        <div class="lens">${esc(fill(t.lens, { m: lensLabel(p.lens) }))}</div>
      </div>
    </div>`).join("");
}

function renderPress(S) {
  const t = L(), c = S.c, v = baseVars(S);
  const bad = c.press.filter((n) => n.kind === "bad").map((n) => ({ n, st: lensStatus(S, n.lens) }))
                     .filter((x) => x.st.bad).sort((a, b) => b.st.sev - a.st.sev).slice(0, 3);
  const good = c.press.filter((n) => n.kind === "good" && !lensStatus(S, n.lens).bad).map((n) => ({ n }));
  const items = bad.concat(good);
  $("press").innerHTML = items.length ? items.map(({ n }) => {
    const vv = lensVars(S, n.lens, v), x = n[state.lang];
    return `<article class="news ${n.kind}"><div class="outlet"><span>${esc(n.outlet)}</span><span>${esc(t.fictional)}</span></div>
      <h4>${esc(cap1(fill(x.h, vv)))}</h4><p>${esc(cap1(fill(x.s, vv)))}</p>
      <div class="lens">${esc(fill(t.lens, { m: lensLabel(n.lens) }))}</div></article>`;
  }).join("") : `<p class="muted small">${esc(t.pressNone)}</p>`;
}

function evaluate(record) {
  const S = compute(), t = L(), c = S.c, x = cl(c), m = MK[c.objective];
  const a = S.R.A[m], b = S.R.B[m], gap = Math.abs(a - b);
  const degenerate = S.R.T.selRate < 0.05 || S.R.T.selRate > 0.95;
  const ok = gap <= TOL && !degenerate;
  // Alineado "por coincidencia": la brecha objetivo es pequeña, pero se optimizó otra métrica
  const lucky = ok && state.strategy !== c.objective && state.strategy !== "manual";
  const fb = (c.fb[state.lang][state.strategy]) || FB_GENERIC[state.lang][state.strategy] || "";
  const costs = ["sr", "tpr", "ppv"].filter((k) => k !== m && lensStatus(S, k).bad)
    .map((k) => `${METRICS[k][state.lang].fair}: ${pct(S.R.A[k])} (${gname(c, "A")}) vs ${pct(S.R.B[k])} (${gname(c, "B")})`);
  const complain = voiceList(S).filter((q) => q.st === "bad").map((q) => `${q.name} — ${q.role}`);
  const mName = METRICS[m][state.lang].fair, sName = t.strat[state.strategy][0];
  const choiceOk = state.strategy === c.objective || (state.strategy === "manual" && ok);
  const choice = state.strategy === c.objective ? t.choiceRight
    : state.strategy === "manual" ? (ok ? t.choiceManualOk : t.choiceNone)
    : state.strategy === "single" ? t.choiceNone : t.choiceWrong;
  const justif = $("justif").value.trim();
  $("verdict").innerHTML = `<div class="verdict ${ok && !lucky ? "ok" : lucky ? "" : "ko"}"${lucky ? ` style="background:var(--warn-bg)"` : ""}>
    <h3>${lucky ? "⚠ " + esc(t.lucky) : ok ? "✓ " + esc(t.aligned) : "✗ " + esc(t.misaligned)}</h3>
    <p class="choice"><b>${choiceOk ? "✓" : "✗"}</b> ${esc(fill(choice, { m: mName, s: sName }))}</p>
    <p class="small"><b>${esc(fill(t.targetIs, { m: METRICS[m][state.lang].fair }))}</b> ${esc(fill(t.gapIs, { g: isNaN(gap) ? "—" : (gap * 100).toFixed(1), a: pct(a), b: pct(b) }))}</p>
    ${lucky ? `<p class="small">${esc(t.luckyTxt)}</p>` : ""}
    ${degenerate ? `<p class="small">${esc(t.degenerateV)}</p>` : ""}
    <p class="small">${esc(fb)}</p>
    <p class="small"><b>${esc(t.costs)}</b></p>
    ${costs.length ? `<ul class="small">${costs.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : `<p class="small">${esc(t.noCosts)}</p>`}
    ${complain.length ? `<p class="small"><b>${esc(t.complaints)}</b></p><ul class="small">${complain.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    ${justif ? `<p class="small"><b>${esc(t.yourJustif)}</b> <i>${esc(justif)}</i></p>` : ""}
  </div>`;
  if (!record) return;
  const entry = {
    time: new Date().toLocaleString(state.lang === "es" ? "es-MX" : "en-US"),
    caseT: x.title, strat: t.strat[state.strategy][0], A: gname(c, "A"), B: gname(c, "B"),
    tA: S.tA.toFixed(1), tB: state.tB.toFixed(1), verdict: lucky ? t.lucky : ok ? t.aligned : t.misaligned,
    justif,
    rates: ["sr", "tpr", "ppv", "fpr"].map((k) => `${METRICS[k][state.lang].name}: A ${pct(S.R.A[k])} | B ${pct(S.R.B[k])}`).join("; ")
  };
  state.log.push(entry);
  renderLog();
}
function renderLog() {
  const t = L();
  $("log").innerHTML = state.log.map((e) => `<li>${esc(fill(t.logEntry, { t: e.time, case: e.caseT, strat: e.strat, A: e.A, B: e.B, tA: e.tA, tB: e.tB, v: e.verdict }))}${e.justif ? `<br><span class="muted">${esc(e.justif)}</span>` : ""}</li>`).join("");
}
function downloadLog() {
  const t = L();
  const lines = [t.logTitle, "=".repeat(t.logTitle.length), ""];
  state.log.forEach((e, i) => {
    lines.push(`${i + 1}. ${fill(t.logEntry, { t: e.time, case: e.caseT, strat: e.strat, A: e.A, B: e.B, tA: e.tA, tB: e.tB, v: e.verdict })}`);
    lines.push("   " + e.rates);
    if (e.justif) lines.push(`   ${t.justifLabel}: ${e.justif}`);
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "bitacora-fairness-mt4034.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renderStepper() {
  document.querySelectorAll("#stepper button").forEach((b) => {
    const n = +b.dataset.scr;
    b.classList.toggle("on", n === state.screen);
    b.classList.toggle("done", n < state.screen);
    b.disabled = n === 3 && !state.deployed;
  });
}
function showScreen(n) {
  if (n === 3 && !state.deployed) return;
  state.screen = n;
  for (const k of [1, 2, 3]) $("scr-" + k).hidden = k !== n;
  renderStepper();
  window.scrollTo(0, 0);
}
function renderRecap(S) {
  const t = L(), c = S.c, x = cl(c);
  const caseLine = `<p><b>${esc(fill(t.recapCase, { c: x.title }))}</b> · <span class="muted">${esc(x.tag)}</span></p>`;
  $("recap2").innerHTML = caseLine + `<p><b>${esc(t.objective)}:</b> ${esc(x.objectiveTxt)}</p>`;
  $("recap3").innerHTML = caseLine + `<p>${esc(fill(t.recapDecision, { s: t.strat[state.strategy][0], A: gname(c, "A"), B: gname(c, "B"), tA: S.tA.toFixed(1), tB: state.tB.toFixed(1) }))}</p>`;
}

function renderAll() { renderStatic(); renderCases(); renderStrats(); update(); renderLog(); renderStepper(); }

// ---------------------------------------------------------------------------
// Eventos
// ---------------------------------------------------------------------------
$("btn-lang").addEventListener("click", () => {
  state.lang = state.lang === "es" ? "en" : "es";
  try { localStorage.setItem("fairsim-lang", state.lang); } catch (e) { /* sin almacenamiento */ }
  renderAll();
  if (state.deployed) evaluate(false);
});
// Cualquier cambio en el caso o en la decisión obliga a volver a desplegar
function invalidate() { state.deployed = false; $("verdict").innerHTML = ""; renderStepper(); }
$("cases").addEventListener("click", (e) => {
  const b = e.target.closest(".case-btn"); if (!b) return;
  state.caseIdx = +b.dataset.i; state.tB = cur().tB; state.tA = cur().tB;
  invalidate();
  renderCases(); renderStrats(); update();
});
$("strats").addEventListener("change", (e) => {
  if (e.target.name !== "strat") return;
  state.strategy = e.target.value;
  invalidate();
  renderStrats(); update();
});
$("in-B").addEventListener("input", (e) => { state.tB = +e.target.value; invalidate(); update(); });
$("in-A").addEventListener("input", (e) => { state.tA = +e.target.value; invalidate(); update(); });
$("justif").addEventListener("input", () => { $("justif-warn").innerHTML = ""; });
$("stepper").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  showScreen(+b.dataset.scr);
});
$("btn-next1").addEventListener("click", () => showScreen(2));
$("btn-back2").addEventListener("click", () => showScreen(1));
$("btn-back3").addEventListener("click", () => showScreen(2));
$("btn-other").addEventListener("click", () => showScreen(1));
$("btn-deploy").addEventListener("click", () => {
  if (!$("justif").value.trim()) {
    $("justif-warn").innerHTML = `<div class="warnbox">${esc(L().justifNeeded)}</div>`;
    $("justif").focus();
    return;
  }
  state.deployed = true;
  update();
  evaluate(true);
  showScreen(3);
});
$("btn-dl").addEventListener("click", downloadLog);
// Resalta en la matriz las celdas que usa cada fórmula
$("formulas").addEventListener("mouseover", (e) => {
  const card = e.target.closest(".fcard");
  document.querySelectorAll("td.hl").forEach((td) => td.classList.remove("hl"));
  if (!card) return;
  METRICS[card.dataset.m].cells.forEach((k) => document.querySelectorAll(`td[data-cell="${k}"]`).forEach((td) => td.classList.add("hl")));
});
$("formulas").addEventListener("mouseleave", () => document.querySelectorAll("td.hl").forEach((td) => td.classList.remove("hl")));

state.tB = cur().tB;
renderAll();
</script>
