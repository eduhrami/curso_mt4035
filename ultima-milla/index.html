:`First Attempt Delivery Success`,def:`Entregas exitosas al primer intento / intentos de entrega.`,category:hx},{term:`CPD`,full:`Cost per Delivered order`,def:`Costo por pedido entregado: costo total de última milla / entregas exitosas (US$).`,category:hx},{term:`CTS`,full:`Cost-to-Serve`,def:`Costo de servir un segmento (zona, cliente o nivel de servicio) / su volumen.`,category:hx},{term:`CSAT`,full:`Customer Satisfaction`,def:`Satisfacción del cliente: calificación promedio de 1 a 5.`,category:hx},{term:`NPS`,full:`Net Promoter Score`,def:`% de clientes promotores − % de detractores.`,category:hx},{term:`Spoilage`,full:`Spoilage rate`,def:`Pedidos frescos que llegan con la cadena de frío rota (tibios) / pedidos frescos.`,aliases:[`spoilage rate`],category:hx},{term:`Order Cycle Time`,def:`Tiempo de ciclo del pedido: horas desde la compra hasta la entrega.`,category:hx},{term:`Vehicle Util.`,full:`Vehicle Utilization`,def:`Capacidad usada de los vehículos en ruta / capacidad disponible.`,aliases:[`utilización de vehículo`,`utilización de flota`],category:hx},{term:`Node Util.`,full:`Node Utilization`,def:`Pedidos surtidos / capacidad de picking del nodo más cargado.`,category:hx},{term:`Backlog`,def:`Pedidos que no se entregaron en su día y pasan al siguiente / carga del día.`,category:hx},{term:`Exceptions`,full:`Delivery Exception Rate`,def:`Entregas con alguna excepción (falla, daño, spoilage, robo) / entregas.`,category:hx},{term:`Perfect Order`,def:`Orden perfecta: a tiempo × completa × sin daño × con documentación correcta.`,category:hx},{term:`ETA`,full:`Estimated Time of Arrival`,def:`Hora estimada de llegada que se comunica al cliente. ETA accuracy: 1 − error del ETA / ancho de la ventana.`,category:hx},{term:`Stops/route`,def:`Paradas por ruta: entregas que hace cada vehículo en su recorrido.`,aliases:[`paradas por ruta`,`paradas por hora`],category:hx},{term:`Route Efficiency`,def:`Distancia del mejor diseño de ruta posible / distancia real recorrida.` ismo → KPI.`},ES={id:`DB-05`,question:`Armaste tu propio escenario: ¿qué factores cambiaste respecto al perfil neutro, qué querías probar y qué confirmaste o refutaste con tus KPIs?`,hint:`Si tienes una corrida en un escenario predefinido, compárala con esta.`};function DS(e){let t=CS(e),n=t?{id:`DB-05`,question:t.question,hint:t.hint}:ES;return{scenario:t?.title??`Escenario propio`,concept:t?.concept,notes:t?.watch??[`Qué factores de tu perfil movieron más tus KPIs`,`Cómo se comparan tus resultados con los de un escenario predefinido`],questions:[...wS,n,TS]}}var OS=[{id:`Estrategia`,label:`Estrategia`},{id:`Red`,label:`Red`},{id:`Asignación`,label:`Asignación`},{id:`Promesa`,label:`Promesa`},{id:`Flota`,label:`Flota`},{id:`Zonas y ruteo`,label:`Zonas y ruteo`},{id:`Cliente`,label:`Cliente`},{id:`Devoluciones`,label:`Devoluciones`},{id:`Datos y seguridad`,label:`Datos y seguridad`}],kS={speed:`Velocidad`,reliability:`Confiabilidad`,efficiency:`Eficiencia`,nearest:`Nodo más cercano`,lowest:`Menor costo`,threshold:`Umbral de costo dinámico`,ai:`IA`,"1h":`1 h`,"2h":`2 h`,"4h":`4 h`,day:`Todo el día`,customer:`Por cliente`,category:`Por categoría`,zone:`Por zona`,none:`Ninguno`,"3pl":`3PL`,own:`Propia`,own_3pl:`Propia 60% + 3PL`,own_crowd:`Propia 60% + crowdsourced`,crowd:`Crowdsourced`,van:`Camioneta de combustión`,ev:`Camioneta eléctrica`,moto:`Moto`,bike:`Bici de carga`,reefer:`Refrigerada`,coolers:`Hieleras`,multi:`Multi-temperatura`,lean:`Justa (−10%)`,standard:`Estándar`,ample:`Holgada (+25%)`,fixed:`Fija`,per_stop:`Por parada`,mixed:`Mixta`,advance:`Contrato anticipado`,spot:`Spot (de último momento)`,kmeans:`k-means`,balanced:`Balanceada`,capacitated:`Con capacidad`,dynamic:`Dinámica`,never:`Nunca`,quarterly:`Trimestral`,monthly:`Mensual`,daily:`Diaria`,manual:`Manual`,heuristic:`Heurística`,vrptw:`VRPTW (optimizador)`,euclid:`Distancia euclidiana`,avgtime:`Tiempo promedio`,timedep:`Tiempo según la hora`,fresh_first:`Frescos primero`,sms:`SMS con ETA`,live:`Seg
