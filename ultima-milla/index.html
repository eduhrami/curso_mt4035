category:gx},{term:`OTIF`,full:`On-Time In-Full`,def:`Entregas a tiempo y con el pedido completo / total de entregas.`,category:gx},{term:`FADS`,full:`First Attempt Delivery Success`,def:`Entregas exitosas al primer intento / intentos de entrega.`,category:gx},{term:`CPD`,full:`Cost per Delivered order`,def:`Costo por pedido entregado: costo total de última milla / entregas exitosas (US$).`,category:gx},{term:`CTS`,full:`Cost-to-Serve`,def:`Costo de servir un segmento (zona, cliente o nivel de servicio) / su volumen.`,category:gx},{term:`CSAT`,full:`Customer Satisfaction`,def:`Satisfacción del cliente: calificación promedio de 1 a 5.`,category:gx},{term:`NPS`,full:`Net Promoter Score`,def:`% de clientes promotores − % de detractores.`,category:gx},{term:`Spoilage`,full:`Spoilage rate`,def:`Pedidos frescos que llegan con la cadena de frío rota (tibios) / pedidos frescos.`,aliases:[`spoilage rate`],category:gx},{term:`Order Cycle Time`,def:`Tiempo de ciclo del pedido: horas desde la compra hasta la entrega.`,category:gx},{term:`Vehicle Util.`,full:`Vehicle Utilization`,def:`Capacidad usada de los vehículos en ruta / capacidad disponible.`,aliases:[`utilización de vehículo`,`utilización de flota`],category:gx},{term:`Node Util.`,full:`Node Utilization`,def:`Pedidos surtidos / capacidad de picking del nodo más cargado.`,category:gx},{term:`Backlog`,def:`Pedidos que no se entregaron en su día y pasan al siguiente / carga del día.`,category:gx},{term:`Exceptions`,full:`Delivery Exception Rate`,def:`Entregas con alguna excepción (falla, daño, spoilage, robo) / entregas.`,category:gx},{term:`Perfect Order`,def:`Orden perfecta: a tiempo × completa × sin daño × con documentación correcta.`,category:gx},{term:`ETA`,full:`Estimated Time of Arrival`,def:`Hora estimada de llegada que se comunica al cliente. ETA accuracy: 1 − error del ETA / ancho de la ventana.`,category:gx},{term:`Stops/route`,def:`Paradas por ruta: entregas que hace cada vehículo en su recorrido.`,aliases:[`paradas por ruta`,`paradas por hora`],category:gx},{term:`Route Efficiency`,def:`Distancia del mejor diseño de ruta posible / distancia real recorrida.`,category:gx},{term:`Empty Miles`,def:`Kilómetros recorridos sin carga / kilómetros totales.`,category:gx},{term:`OSA`,full:`On-Shelf Availability`,def:`Disponibilidad en anaquel de la tienda física. Cae si la tienda dedica demasiadas horas a surtir pedidos en línea.`,category:gx},{term:`p95`,full:`Percentil 95`,def:`Valor que solo el 5% de los días peores supera. Muestra los días críticos que el promedio esconde (para KPI donde más es mejor se usa el percentil 5).`,aliases:[`percentil`],category:gx},{term:`Guardrail`,def:`KPI de contención: un límite que no debe romperse mientras se mejora el KPI primario.`,aliases:[`guardrails`,`primario–guardrail`],category:gx},{term:`Fulfillment`,def:`Proceso de surtir un pedido: recibirlo, prepararlo (picking), empacarlo y entregarlo.`,category:_x},{term:`Última milla`,def:`Último tramo de la entrega: del nodo de surtido a la puerta del cliente. Suele ser el más caro por pedido.`,category:_x},{term:`CD`,full:`Centro de distribución`,def:`Almacén central desde el que se surten pedidos o se reabastecen tiendas.`,category:_x},{term:`SFD`,full:`Ship-from-DC`,def:`Surtir el pedido en línea desde el CD.`,aliases:[`Ship-from-DC`],category:_x},{term:`SFS`,full:`Ship-from-Store`,def:`Surtir el pedido en línea desde una tienda cercana al cliente, con personal de la tienda.`,aliases:[`Ship-from-store`],category:_x},{term:`BOPIS`,full:`Buy Online, Pick-up In Store`,def:`Compra en línea y recoge en tienda.`,category:_x},{term:`Dark store`,def:`Tienda cerrada al público que funciona solo como almacén para pedidos en línea.`,aliases:[`dark stores`],category:_x},{term:`MFC`,full:`Micro-Fulfillment Center`,def:`Pequeño centro de surtido automatizado, cerca de la demanda urbana.`,category:_x},{term:`Locker`,def:`Casillero o punto de recolección desatendido donde el cliente recoge su pedido.`,aliases:[`lockers`,`puntos de recolección`],category:_x},{term:`Micro-hub`,def:`Pequeño centro de cross-dock cerca de zonas lejanas que consolida la carga troncal y la reparte.`,aliases:[`micro-hubs`],category:_x},{term:`Cross-dock`,def:`Operación en la que la mercancía entra y sale casi de inmediato, sin almacenarse.`,category:_x},{term:`Troncal`,full:`Linehaul`,def:`Transporte de alto volumen entre el nodo central y los nodos cercanos al cliente.`,category:_x},{term:`Picking`,def:`Recolección de los artículos de un pedido en el almacén o la tienda.`,category:_x},{term:`ATP`,full:`Available-to-Promise`,def:`Inventario y capacidad disponibles para comprometer un pedido; el batching ATP agrupa pedidos antes de asignarles nodo.`,category:vx},{term:`Batching`,def:`Agrupar pedidos en lotes por intervalos de tiempo antes de asignarlos o rutearlos.`,category:vx},{term:`Slotting`,def:`Publicar una capacidad limitada por ventana y zona para no prometer más de lo que se puede entregar.`,category:vx},{term:`Hora de corte`,full:`Cut-off`,def:`Hora límite para que un pedido entre al nivel de servicio del mismo día.`,aliases:[`cut-off`],category:vx},{term:`Holgura`,full:`Buffer`,def:`Margen de tiempo que se agrega a la promesa de entrega sobre el tiempo estimado.`,aliases:[`buffer`],category:vx},{term:`Ventana de entrega`,def:`Intervalo de tiempo en que se promete la entrega (1 h, 2 h, 4 h o todo el día).`,category:vx},{term:`Express`,def:`Nivel de servicio de entrega en menos de 2 horas.`,category:vx},{term:`Segmentación`,def:`Ofrecer distintos niveles de servicio según el cliente, la categoría o la zona.`,category:vx},{term:`3PL`,full:`Third-Party Logistics`,def:`Operador logístico externo que presta flota y choferes.`,category:yx},{term:`Crowdsourced`,def:`Repartidores independientes que se contratan por entrega a través de una plataforma.`,category:yx},{term:`VRPTW`,full:`Vehicle Routing Problem with Time Windows`,def:`Problema de ruteo de vehículos con ventanas de tiempo; el optimizador busca rutas que respeten las ventanas al menor costo.`,category:yx},{term:`Heurística`,def:`Método de solución aproximado y rápido (p. ej., savings o cluster-first/route-second).`,category:yx},{term:`k-means`,def:`Algoritmo que agrupa puntos (domicilios) en k zonas según su cercanía.`,category:yx},{term:`Zonificación`,def:`División del territorio en zonas de reparto.`,aliases:[`re-zonificación`],category:yx},{term:`Backhaul`,def:`Aprovechar el viaje de regreso de una ruta para recoger devoluciones u otra carga.`,category:yx},{term:`Telemetría`,def:`Sensores en el vehículo que reportan ubicación, velocidad y temperatura en tiempo real.`,category:yx},{term:`GPS`,full:`Global Positioning System`,def:`Sistema de posicionamiento por satélite.`,category:yx},{term:`EV`,full:`Electric Vehicle`,def:`Vehículo eléctrico.`,category:yx},{term:`SMS`,full:`Short Message Service`,def:`Mensaje de texto al celular del cliente.`,category:bx},{term:`Geocodificación`,def:`Convertir una dirección escrita en coordenadas para ubicarla con precisión.`,category:bx},{term:`Pago contra entrega`,full:`COD (Cash on Delivery)`,def:`El cliente paga al recibir el pedido.`,aliases:[`COD`],category:bx},{term:`IA`,full:`Inteligencia artificial`,def:`En el simulador, ruteo basado en modelos que aprenden de los datos de operación.`,category:bx},{term:`Logística inversa`,def:`Flujo de devoluciones del cliente de regreso a la empresa.`,aliases:[`devoluciones`],category:bx},{term:`Pronóstico`,def:`Estimación de la demanda futura. En el simulador (F-01) se captura en enero de cada año con parámetros estimados de los datos y dimensiona la flota contratada.`,aliases:[`pronosticar`,`pronosticas`],category:Sx},{term:`Serie de tiempo`,def:`Datos ordenados en el tiempo (aquí, pedidos por día). Se descompone en tendencia, estacionalidad y ruido.`,aliases:[`series de tiempo`],category:Sx},{term:`Tendencia`,def:`Movimiento de largo plazo de la serie; aquí, el crecimiento anual compuesto del canal en línea.`,c
