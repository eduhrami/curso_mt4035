nt`,def:`Punto de reorden: nivel de inventario en el que se lanza un nuevo pedido (revisión continua).`,category:_x},{term:`EOQ`,full:`Economic Order Quantity`,def:`Cantidad económica de pedido: el tamaño de lote que equilibra el costo de pedir y el de mantener inventario.`,category:_x},{term:`Revisión periódica`,def:`Política de inventario que revisa y pide cada cierto intervalo fijo, en lugar de hacerlo al cruzar un punto de reorden.`,category:_x},{term:`CSL`,full:`Cycle Service Level`,def:`Nivel de servicio por ciclo: probabilidad de no quedarse sin stock durante un ciclo de reposición. Determina el stock de seguridad.`,category:_x},{term:`Stock de seguridad`,def:`Inventario adicional para absorber la variabilidad de la demanda y del lead time.`,aliases:[`inventario de seguridad`],category:_x},{term:`SKU`,full:`Stock Keeping Unit`,def:`Unidad de inventario: cada producto distinto (por presentación, tamaño, etc.) que se gestiona por separado.`,aliases:[`SKUs`],category:_x},{term:`FIFO`,full:`First In, First Out`,def:`Primero en entrar, primero en salir: se venden primero las unidades más antiguas.`,category:_x},{term:`Tanpin kanri`,def:`Gestión por artículo de Seven-Eleven Japan: el encargado de tienda pide con base en hipótesis sobre la demanda (clima, eventos) apoyado en datos de POS.`,category:_x},{term:`POS`,full:`Point of Sale`,def:`Punto de venta: el sistema de caja que registra cada venta. Sus datos permiten pronosticar y compartir la demanda real.`,category:vx},{term:`VMI`,full:`Vendor-Managed Inventory`,def:`Inventario administrado por el proveedor: el proveedor decide cuándo y cuánto reponer con la información del cliente.`,category:vx},{term:`CPFR`,full:`Collaborative Planning, Forecasting and Replenishment`,def:`Planeación, pronóstico y reposición colaborativos entre cliente y proveedor.`,category:vx},{term:`Arm's-length`,def:`Relación transaccional con el proveedor, sin compartir información ni planear en conjunto.`,category:vx},{term:`Pronóstico caus
