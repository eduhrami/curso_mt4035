_x},{term:`OTIF`,full:`On-Time In-Full`,def:`Entregas del CEDIS a la tienda que llegan a tiempo y completas / total de entregas.`,category:_x},{term:`OFR`,full:`Order Fill Rate`,def:`Porcentaje de pedidos surtidos completos (todo o nada por pedido).`,category:_x},{term:`CTS`,full:`Cost-to-Serve`,def:`Costo de servir: costo logístico total de abastecer a las tiendas. En el simulador se expresa como % de las ventas o por tienda.`,category:_x},{term:`Waste`,full:`Merma`,def:`Unidades que se pierden (caducan o se dañan) / unidades recibidas. Pesa sobre todo en frescos.`,aliases:[`merma`],category:_x},{term:`Lost Sales`,full:`Ventas perdidas`,def:`Demanda que no se atendió ni se sustituyó por otro producto / demanda total. En la vida real casi nunca se observa directamente.`,aliases:[`ventas perdidas`],category:_x},{term:`ITR`,full:`Inventory Turnover`,def:`Rotación de inventario: COGS anual / inventario promedio. Cuántas veces al año se renueva el inventario.`,category:_x},{term:`DOI`,full:`Days of Inventory`,def:`Días de inventario: inventario promedio / COGS diario. Complemento de la rotación.`,category:_x},{term:`GMROI`,full:`Gross Margin Return on Inventory`,def:`Margen bruto / inventario promedio a costo: cuánto margen genera cada peso invertido en inventario.`,category:_x},{term:`EBITDA`,full:`Earnings Before Interest, Taxes, Depreciation and Amortization`,def:`Utilidad antes de intereses, impuestos, depreciación y amortización. En el simulador, EBITDA logístico: margen menos merma y costos logísticos, como % de ventas.`,category:_x},{term:`BWR`,full:`Bullwhip Ratio`,def:`Var(órdenes al proveedor) / Var(demanda en tienda). Mide el efecto látigo; 1 es lo ideal.`,category:_x},{term:`LT`,full:`Lead Time`,def:`Tiempo de reposición del proveedor a la tienda, en días. Su variabilidad (σ LT) pesa tanto o más que su promedio.`,aliases:[`lead time`,`σ LT`],category:_x},{term:`Trucks`,full:`Camiones por tienda al día`,def:`Entregas que recibe cada tienda al día. Indicador de complejidad operativa en tienda.`,category:_x},{term:`COGS`,full:`Cost of Goods Sold`,def:`Costo de la mercancía vendida.`,category:_x},{term:`Guardrail`,def:`KPI de contención: un límite que no debe romperse mientras se mejora el KPI primario (p. ej., mejorar el servicio sin disparar el costo).`,aliases:[`guardrails`],category:_x},{term:`CEDIS`,full:`Centro de distribución`,def:`Instalación que recibe mercancía de proveedores y la reparte a las tiendas. Puede guardar inventario o solo cruzarlo (cross-dock). La distancia del CEDIS a cada tienda fija cuántas veces por semana se le puede entregar: cerca, hasta 2 veces al día; muy lejos, 1 vez por semana.`,aliases:[`CD`,`centro de distribución`,`centros de distribución`],category:vx},{term:`Planta de proveedores`,def:`Instalación de un proveedor dentro de la región (◆ en el mapa). Es un dato del escenario: no la decides tú. Si es dedicada, trabaja solo para Hoshi Mart y su lead time es más corto. Un CEDIS cerca de la planta paga menos flete de entrada; uno cerca de las tiendas, menos reparto.`,aliases:[`plantas de proveedores`,`planta dedicada`,`proveedor dedicado`,`proveedores dedicados`],category:vx},{term:`Flete de entrada`,def:`Costo de traer la mercancía de la planta del proveedor al CEDIS (por caja y kilómetro). Con proveedores externos a la región va incluido en el precio.`,aliases:[`flete de proveedores`],category:vx},{term:`Cross-dock`,def:`Operación en la que la mercancía entra al CEDIS y sale casi de inmediato hacia las tiendas, sin almacenarse.`,aliases:[`cross-docking`],category:vx},{term:`Consolidación`,def:`Juntar en un mismo envío la carga de varios proveedores o categorías para llenar mejor los camiones.`,category:vx},{term:`Multi-temperatura`,def:`Vehículo con compartimentos a distintas temperaturas, que permite llevar frescos, refrigerados y congelados en un solo viaje.`,category:vx},{term:`Telemetría`,def:`Sensores en el vehículo que reportan ubicación, temperatura y estado en tiempo real.`,category:vx},{term:`Horas valle`,def:`Horarios de baja actividad (tráfico y ventas) en los que se puede entregar a tienda con menos congestión.`,category:vx},{term:`Dominancia`,def:`Estrategia de apertura que concentra tiendas en zonas compactas (clusters) alrededor de los CEDIS para ganar densidad.`,aliases:[`clusters`,`cluster`],category:vx},{term:`Greenfield`,def:`Empezar desde cero, sin tiendas ni CEDIS existentes.`,category:vx},{term:`Capex`,full:`Capital Expenditure`,def:`Inversión de capital: gasto en activos de largo plazo, como construir o ampliar un CEDIS.`,category:vx},{term:`ROP`,full:`Reorder Point`,def:`Punto de reorden: nivel de inventario en el que se lanza un nuevo pedido (revisión continua).`,category:yx},{term:`EOQ`,full:`Economic Order Quantity`,def:`Cantidad económica de pedido: el tamaño de lote que equilibra el costo de pedir y el de mantener inventario.`,category:yx},{term:`Revisión periódica`,def:`Política de inventario que revisa y pide cada cierto intervalo fijo, en lugar de hacerlo al cruzar un punto de reorden.`,category:yx},{term:`CSL`,full:`Cycle Service Level`,def:`Nivel de servicio por ciclo: probabilidad de no quedarse sin stock durante un ciclo de reposición. Determina el stock de seguridad. Aquí lo fija tu propuesta de valor por categoría; la disponibilidad real (OSA) puede quedar abajo de esa meta.`,category:yx},{term:`Stock de seguridad`,def:`Inventario adicional para absorber la variabilidad de la demanda y del lead time.`,aliases:[`inventario de seguridad`],category:yx},{term:`SKU`,full:`Stock Keeping Unit`,def:`Unidad de inventario: cada producto distinto (por presentación, tamaño, etc.) que se gestiona por separado.`,aliases:[`SKUs`],category:yx},{term:`FIFO`,full:`First In, First Out`,def:`Primero en entrar, primero en salir: se venden primero las unidades más antiguas.`,category:yx},{term:`Tanpin kanri`,def:`Gestión por artículo de Seven-Eleven Japan: el encargado de tienda pide con base en hipótesis sobre la demanda (clima, eventos) apoyado en datos de POS.`,category:yx},{term:`POS`,full:`Point of Sale`,def:`Punto de venta: el sistema de caja que registra cada venta. Sus datos permiten pronosticar y compartir la demanda real.`,category:bx},{term:`RMI`,full:`Retailer-Managed Inventory`,def:`Inventario administrado por el minorista: tú pronosticas y decides cuándo y cuánto reponer; el proveedor solo surte lo que pides. Es el punto de partida.`,category:bx},{term:`CPFR`,full:`Collaborative Planning, Forecasting and Replenishment`,def:`Planeación, pronóstico y reposición colaborativos entre cliente y proveedor: los dos comparten datos y acuerdan un pronóstico. Baja el error y el lead time, pero cuesta implementarlo y madura en varios trimestres.`,category:bx},{term:`Arm's-length`,def:`Relación transaccional con el proveedor, sin compartir información ni planear en conjunto.`,category:bx},{term:`Pronóstico avanzado`,def:`Modelo de suavizamiento exponencial con tendencia y estacionalidad (Holt-Winters) más variables causales (clima, calendario, promociones), operado por un equipo de analítica. El básico usa promedios móviles y no ve la estacionalidad.`,aliases:[`Holt-Winters`,`pronóstico causal`],category:bx},{term:`Utilidad`,def:`Puntaje definitivo: EBITDA logístico (margen bruto − merma − rebajas − costos logísticos − TI) − inversión − penalizaciones por servicio, acumulado en los 12 trimestres.`,aliases:[`utilidad acumulada`],category:`Dinero`},{term:`Penalización por servicio`,def:`Cada trimestre en que rompes un guardrail de servicio de tu propuesta de valor (p. ej., OSA mínima) pierdes un % de las ventas del trimestre: penalizaciones y clientes que se van.`,aliases:[`penalizaciones por servicio`],category:`Dinero`},{term:`Tope de inversión`,def:`Máximo que puedes gastar en decisiones en un año (CEDIS nuevos, conversiones, ampliaciones y cierres; aperturas y cierres de tiendas; escaneo y POS). Si un trimestre lo excede no lo puedes confirmar: prioriza o difiere al año siguiente. Se renueva vo`,rop:`ROP / EOQ`,periodic:`Revisión periódica`,tanpin:`Tanpin kanri`,manual:`Conteo manual`,scan:`Escaneo contra pedido`,fifo:`FIFO estricto`,basic:`POS básico`,pos_daily:`POS con análisis diario`,pos_terminal:`POS + terminal gráfica`,no:`No`,yes:`Sí`,cpfr:`CPFR`,low:`Baja`,mid:`Media`,high:`Alta`,stocking:`Con inventario`,crossdock:`Cross-dock`,small:`Pequeño`,medium:`Mediano`,large:`Grande`},pC={"F-01":`Tu pronóstico fija cuánto piden las tiendas durante el año. Si te quedas corto, baja la OSA y suben las ventas perdidas; si te pasas, compras de más: sube el inventario (baja la ITR), sube la merma de frescos y aparecen rebajas que restan utilidad. El CV que captures dimensiona el stock de seguridad: subestimarlo deja a las tiendas sin protección ante picos. Con POS diario la reposición corrige parte del error con las ventas reales, así que equivocarse cuesta menos.`,"D-01":`Más CEDIS acercan la mercancía a las tiendas: baja la distancia de reparto y el costo de transporte, sube la OTIF y, en frescos, baja la merma porque el producto pasa menos tiempo en ruta. A cambio sube el costo fijo (renta, personal) y la inversión, y cada CEDIS tarda 2–4 trimestres en operar. La ubicación es un trade-off: cerca de las plantas de proveedores (◆ en el mapa) baja el flete de entrada y la edad de los frescos; cerca de las tiendas baja el reparto. El tipo también importa: el CEDIS con inventario amortigua fallas del proveedor y permite stock de seguridad agregado (pooling), pero envejece el producto, y los frescos de vida corta pierden días de anaquel guardados en él; el cross-dock y el combinado mueven rápido sin almacenar, y el combinado es el único que permite consolidar varias temperaturas en un camión. La distancia también fija cuántas veces por semana puedes visitar cada tienda: cerca de un CEDIS, hasta 2 veces al día; muy lejos, 1 vez por semana. Un CEDIS saturado sube la merma y baja la OTIF. Todas las tiendas se surten desde un CEDIS: la red nunca puede quedar vacía, y una zona sin CEDIS en operación no recibe mercancía.`,"D-05":`Define dónde caen las tiendas nuevas. La dominancia concentra aperturas en zonas donde ya hay tiendas: sube la densidad y las paradas por ruta, y baja el costo de servir por tienda (CTS), pero a partir de cierta densidad las tiendas se canibalizan y baja la venta por tienda. La apertura dispersa capta más mercado nuevo, pero alarga las rutas y sube el CTS. Solo cuenta cuando abres tiendas.`,"D-08":`Cada tienda nueva suma ventas y margen bruto, pero cuesta inversión el trimestre en que decides el lote y abre el trimestre siguiente. Más tiendas también llenan los CEDIS: si la capacidad no alcanza, sube la utilización y con ella la merma y los retrasos. Dónde caen depende de la estrategia de apertura.`,"D-09":`Cerrar tiendas quita sus ventas y su margen, pero también su costo de servirlas: conviene en zonas donde las tiendas están tan dispersas o tan lejos de los CEDIS que el reparto cuesta más de lo que dejan, o donde se canibalizan entre sí. Cada cierre cuesta una indemnización y el efecto en el costo de servir (CTS) aparece el trimestre siguiente. Las tiendas cerradas no vuelven: para crecer otra vez hay que abrir lotes nuevos.`,"D-11":`Más entregas por semana bajan la cobertura de cada pedido: el producto llega más fresco (baja la merma), baja el inventario en tienda (sube la ITR) y sube la OSA. A cambio, cada entrega adicional cuesta transporte y recepción, así que sube el CTS. En frescos de vida corta la frecuencia alta suele pagarse; en abarrotes casi nunca. El máximo es de 2 visitas al día (14 por semana), y solo para tiendas cerca de un CEDIS: entre más lejos esté la tienda, menos visitas caben en la semana (hasta 1 por semana en las más lejanas). Pedir más de lo que permite la distancia no tiene efecto en esas zonas.`,"D-12":`La consolidación combinada junta varios proveedores de la misma temperatura en un camión desde un CEDIS combinado: bajan drásticamente los camiones por tienda y el costo de recepción, y sube la OTIF. Por proveedor, cada uno llega por separado aunque pase por el CEDIS. Requiere un CEDIS combinado.`,"D-20":`La política fija cómo repone cada tienda. El punto de reorden (ROP/EOQ) supone demanda estable: con estacionalidad y perecederos falla y sube la merma o los faltantes. La revisión periódica es más robusta ante la estacionalidad. El tanpin kanri (el encargado pide con hipótesis sobre clima y eventos) baja el error de pronóstico y con él el stock de seguridad y la merma, sube la OSA; requiere POS con terminal y rinde el doble con capacitación alta.`,"D-22":`Más SKUs por tienda suben la venta potencial (el cliente encuentra más), pero reparten el anaquel: sube el stock de seguridad total, sube la merma y baja la ITR. El surtido local, con POS que lo respalde, adapta la mezcla a cada zona y sube la venta.`,"D-23":`La recepción por escaneo contra pedido reduce el tiempo por parada (rutas más cortas, menor costo de transporte) y los errores de recepción, que restan OSA. Es indispensable para entregar en horas valle. Cuesta una inversión por tienda.`,"D-24":`Días de stock de seguridad en los CEDIS con inventario: amortiguan las fallas del proveedor (sube el fill rate hacia tiendas, baja el riesgo de faltantes en eventos). Como el CEDIS junta la demanda de muchas tiendas, protege con menos inventario total que repartirlo en tiendas (pooling). A cambio sube el inventario en CEDIS y su costo, y los frescos envejecen.`,"D-30":`Un mejor sistema de información en tienda reduce el error de pronóstico (CV efectivo): baja el stock de seguridad necesario y sube la OSA con el mismo inventario. Además, con POS diario la reposición corrige rápido un pronóstico equivocado, así que equivocarse cuesta menos. Cuesta inversión por tienda y operación semanal; tarda 1–2 trimestres en implantarse y uno en madurar, y con un error de pronóstico típico se paga en menos de dos años. La terminal gráfica habilita tanpin kanri.`,"D-31":`Compartir el POS diario con los proveedores les deja planear con tu demanda real: baja el efecto látigo (BWR), sube su fill rate y con él la OTIF y la OSA. Cuesta una integración inicial con los proveedores (consume el tope del año) y una cuota semanal por tienda. Rinde más donde la demanda es volátil o los proveedores son poco confiables; donde la operación ya es estable, puede no pagarse. Es requisito para el CPFR.`,"D-32":`El pronóstico básico usa promedios móviles: es gratis, pero reacciona tarde y no ve la estacionalidad, así que en los cambios de temporada el error sube y con él el stock de seguridad, la merma y los faltantes. El avanzado (suavizamiento exponencial con estacionalidad, tipo Holt-Winters, más variables causales como clima, calendario y promociones) baja el error y el efecto látigo, pero requiere implementar el modelo y mantener un equipo de analítica cada semana. Se paga donde la estacionalidad pesa y el volumen es grande; en operaciones chicas o estables, el costo del equipo puede superar el beneficio. Es distinto del pronóstico anual que capturas en la pestaña «Pronóstico».`,"D-33":`Partes de RMI: tú pronosticas y repones, y los proveedores solo surten lo que pides. El CPFR (planeación, pronóstico y reabasto colaborativos) suma el pronóstico del proveedor al tuyo: baja el error de pronóstico, acorta y estabiliza el lead time y sube el fill rate. Cuesta una implementación (consume el tope del año) y un equipo de planeación conjunta cada semana, y su beneficio crece poco a poco: entra un trimestre después de decidirlo y madura en tres más. Por eso el momento importa: implementado temprano se paga con creces; tarde, ya no alcanza a recuperarse antes de que termine el juego. Requiere compartir el POS con los proveedores.`,"D-34":`La capacitación de los encargados multiplica el beneficio del tanpin kanri: con capacitación alta la reducción del error de pronóstico es cerca del doble que con baja. Sin tanpin kanri casi no cambia los KPIs y solo suma costo operativo.`},mC={"F-01":{help:`Se captura en T1 de cada año con los datos observados hasta ese momento.`},"D-01":{help:`Cada CEDIS tarda 2–4 trimestres en construirse según su tamaño. No se puede mover de zona ni reducir.`},"D-05":{help:`Decide dónde se ubican las tiendas nuevas: concentradas alrededor de tus CEDIS o repartidas.`},"D-08":{help:`Abre un lote de tiendas el trimestre siguiente. Indispensable si empiezas desde cero.`,unit:`tiendas`},"D-09":{help:`Cierra tiendas de una zona el trimestre siguiente. Cada cierre cuesta una indemnización, que consume el tope de inversión del año.`,fields:{zone:`Zona`,stores:`Tiendas a cerrar`}},"D-11":{help:`Entregas por semana a cada tienda. Más frecuencia: más frescura y más costo de transporte. Máximo 14 (2 al día) y menos en tiendas lejos del CEDIS.`,fields:dC,unit:`/sem`},"D-12":{help:`Combinada: un camión por temperatura con varios proveedores. Requiere un CEDIS combinado.`},"D-20":{help:`Tanpin kanri (pedido por hipótesis del encargado) requiere POS + terminal gráfica.`},"D-22":{help:`Más SKUs: más ventas potenciales, más stock de seguridad y más merma.`,fields:{skus:`SKUs por tienda`,local:`Surtido local`}},"D-23":{help:`El escaneo acelera la recepción y reduce errores.`},"D-24":{help:`Días de stock de seguridad en el CEDIS (solo CEDIS con inventario). Amortigua fallas del proveedor.`,unit:`días`,step:.5},"D-30":{help:`Reduce el error de pronóstico. Tarda 1–2 trimestres en implantarse y uno más en madurar.`},"D-31":{help:`Los proveedores reciben tu POS diario. Implementación inicial más cuota semanal por tienda.`,options:{no:`No`,yes:`Sí, a diario`}},"D-32":{help:`Básico: promedios móviles. Avanzado: modelo con estacionalidad y variables causales, con equipo de analítica.`,options:{basic:`Básico (promedios móviles)`,advanced:`Avanzado (equipo de analítica)`}},"D-33":{help:`Partes de RMI (tú pronosticas y repones). El CPFR requiere compartir POS, entra un trimestre después y madura en tres.`,options:{rmi:`RMI (tú pronosticas y repones)`,cpfr:`C
