l cliente lo busca. Tiempo con stock / tiempo total.`,category:gx},{term:`OTIF`,full:`On-Time In-Full`,def:`Entregas del CD a la tienda que llegan a tiempo y completas / total de entregas.`,category:gx},{term:`OFR`,full:`Order Fill Rate`,def:`Porcentaje de pedidos surtidos completos (todo o nada por pedido).`,category:gx},{term:`CTS`,full:`Cost-to-Serve`,def:`Costo de servir: costo logístico total de abastecer a las tiendas. En el simulador se expresa como % de las ventas o por tienda.`,category:gx},{term:`Waste`,full:`Merma`,def:`Unidades que se pierden (caducan o se dañan) / unidades recibidas. Pesa sobre todo en frescos.`,aliases:[`merma`],category:gx},{term:`Lost Sales`,full:`Ventas perdidas`,def:`Demanda que no se atendió ni se sustituyó por otro producto / demanda total. En la vida real casi nunca se observa directamente.`,aliases:[`ventas perdidas`],category:gx},{term:`ITR`,full:`Inventory Turnover`,def:`Rotación de inventario: COGS anual / inventario promedio. Cuántas veces al año se renueva el inventario.`,category:gx},{term:`DOI`,full:`Days of Inventory`,def:`Días de inventario: inventario promedio / COGS diario. Complemento de la rotación.`,category:gx},{term:`GMROI`,full:`Gross Margin Return on Inventory`,def:`Margen bruto / inventario promedio a costo: cuánto margen genera cada peso invertido en inventario.`,category:gx},{term:`EBITDA`,full:`Earnings Before Interest, Taxes, Depreciation and Amortization`,def:`Utilidad antes de intereses, impuestos, depreciación y amortización. En el simulador, EBITDA logístico: margen menos merma y costos logísticos, como % de ventas.`,category:gx},{term:`BWR`,full:`Bullwhip Ratio`,def:`Var(órdenes al proveedor) / Var(demanda en tienda). Mide el efecto látigo; 1 es lo ideal.`,category:gx},{term:`LT`,full:`Lead Time`,def:`Tiempo de reposición del proveedor a la tienda, en días. Su variabilidad (σ LT) pesa tanto o más que su promedio.`,aliases:[`lead time`,`σ LT`],category:gx},{term:`Trucks`,full:`Camiones por tienda al día`,def:`Entregas que recibe cada tienda al día. Indicador de complejidad operativa en tienda.`,category:gx},{term:`COGS`,full:`Cost of Goods Sold`,def:`Costo de la mercancía vendida.`,category:gx},{term:`Guardrail`,def:`KPI de contención: un límite que no debe romperse mientras se mejora el KPI primario (p. ej., mejorar el servicio sin disparar el costo).`,aliases:[`guardrails`],category:gx},{term:`CD`,full:`Centro de distribución`,def:`Instalación que recibe mercancía de proveedores y la reparte a las tiendas. Puede guardar inventario o solo cruzarlo (cross-dock).`,category:_x},{term:`Cross-dock`,def:`Operación en la que la mercancía entra al CD y sale casi de inmediato hacia las tiendas, sin almacenarse.`,aliases:[`cross-docking`],category:_x},{term:`DSD`,full:`Direct Store Delivery`,def:`Entrega directa del proveedor a la tienda, sin pasar por un CD.`,category:_x},{term:`3PL`,full:`Third-Party Logistics`,def:`Operador logístico externo que presta transporte o almacenaje. «Dedicado» reserva recursos para la empresa; «spot» se contrata al momento.`,category:_x},{term:`Consolidación`,def:`Juntar en un mismo envío la carga de varios proveedores o categorías para llenar mejor los camiones.`,category:_x},{term:`Multi-temperatura`,def:`Vehículo con compartimentos a distintas temperaturas, que permite llevar frescos, refrigerados y congelados en un solo viaje.`,category:_x},{term:`Telemetría`,def:`Sensores en el vehículo que reportan ubicación, temperatura y estado en tiempo real.`,category:_x},{term:`Horas valle`,def:`Horarios de baja actividad (tráfico y ventas) en los que se puede entregar a tienda con menos congestión.`,category:_x},{term:`Dominancia`,def:`Estrategia de apertura que concentra tiendas en zonas compactas (clusters) alrededor de los CD para ganar densidad.`,aliases:[`clusters`,`cluster`],category:_x},{term:`Greenfield`,def:`Empezar desde cero, sin tiendas ni CD existentes.`,category:_x},{term:`Capex`,full:`Capital Expenditure`,def:`Inversión de capital: gasto en activos de largo plazo, como construir o ampliar un CD.`,category:_x},{term:`ROP`,full:`Reorder Point`,def:`Punto de reorden: nivel de inventario en el que se lanza un nuevo pedido (revisión continua).`,category:vx},{term:`EOQ`,full:`Economic Order Quantity`,def:`Cantidad económica de pedido: el tamaño de lote que equilibra el costo de pedir y el de mantener inventario.`,category:vx},{term:`Revisión periódica`,def:`Política de inventario que revisa y pide cada cierto intervalo fijo, en lugar de hacerlo al cruzar un punto de reorden.`,category:vx},{term:`CSL`,full:`Cycle Service Level`,def:`Nivel de servicio por ciclo: probabilidad de no quedarse sin stock durante un ciclo de reposición. Determina el stock de seguridad.`,category:vx},{term:`Stock de seguridad`,def:`Inventario adicional para absorber la variabilidad de la demanda y del lead time.`,aliases:[`inventario de seguridad`],category:vx},{term:`SKU`,full:`Stock Keeping Unit`,def:`Unidad de inventario: cada producto distinto (por presentación, tamaño, etc.) que se gestiona por separado.`,aliases:[`SKUs`],category:vx},{term:`FIFO`,full:`First In, First Out`,def:`Primero en entrar, primero en salir: se venden primero las unidades más antiguas.`,category:vx},{term:`Tanpin kanri`,def:`Gestión por artículo de Seven-Eleven Japan: el encargado de tienda pide con base en hipótesis sobre la demanda (clima, eventos) apoyado en datos de POS.`,category:vx},{term:`POS`,full:`Point of Sale`,def:`Punto de venta: el sistema de caja que registra cada venta. Sus datos permiten pronosticar y compartir la demanda real.`,category:yx},{term:`VMI`,full:`Vendor-Managed Inventory`,def:`Inventario administrado por el proveedor: el proveedor decide cuándo y cuánto reponer con la información del cliente.`,category:yx},{term:`CPFR`,full:`Collaborative Planning, Forecasting and Replenishment`,def:`Planeación, pronóstico y reposición colaborativos entre cliente y proveedor.`,category:yx},{term:`Arm's-length`,def:`Relación transaccional con el proveedor, sin compartir información ni planear en conjunto.`,category:yx},{term:`Pronóstico causal`,def:`Pronóstico que explica la demanda con sus causas (clima, calendario, promociones), no solo con su historia.`,category:yx},{term:`Utilidad`,def:`Puntaje definitivo: EBITDA logístico (margen bruto − merma − rebajas − costos logísticos − TI) − inversión − penalizaciones por servicio, acumulado en los 12 trimestres.`,aliases:[`utilidad acumulada`],category:`Dinero`},{term:`Penalización por servicio`,def:`Cada trimestre en que rompes un guardrail de servicio de tu propuesta de valor (p. ej., OSA mínima) pierdes un % de las ventas del trimestre: penalizaciones y clientes que se van.`,aliases:[`penalizaciones por servicio`],category:`Dinero`},{term:`Rebajas`,def:`Pérdida por comprar más de lo que se vende cuando el pronóstico es alto: la mercancía sobrante se vende con descuento o se desecha.`,category:`Dinero`},{term:`Pronóstico`,def:`Estimación de la demanda futura. En el simulador (F-01) se captura en T1 de cada año con parámetros estimados de los datos y fija el inventario de las tiendas.`,aliases:[`pronosticar`,`pronosticas`],category:xx},{term:`Serie de tiempo`,def:`Datos ordenados en el tiempo (aquí, demanda por tienda por semana). Se descompone en tendencia, estacionalidad y ruido.`,aliases:[`series de tiempo`],category:xx},{term:`Tendencia`,def:`Movimiento de largo plazo de la serie; aquí, el crecimiento anual de la demanda por tienda.`,category:xx},{term:`Nivel base`,def:`Unidades por tienda por día de un trimestre de índice 1, al inicio del año que se pronostica.`,category:xx},{term:`Índice estacional`,def:`Multiplicador de un periodo respecto al promedio (p. ej., T3 ×1.10). Se estima dividiendo la serie entre su tendencia.`,aliases:[`índices`],category:xx},{term:`Desestacionalizar`,def:`Quitar a la serie el efecto de la estacionalidad para ver la tendencia y el ruido.`,category:xx},{term:`CV`,full:`Coeficiente de variación`,def:`Desviación está
